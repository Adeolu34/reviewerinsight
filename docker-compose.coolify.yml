# Production on Coolify when MongoDB is external (Atlas, etc.).
# In Coolify → Application → Docker Compose location: docker-compose.coolify.yml
# Set MONGODB_URI in env (do not rely on the mongo service below).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: reviewerinsight-app:latest
    pull_policy: never
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - /var/data/reviewinsight/videos:/var/data/reviewinsight/videos
      - /var/data/reviewinsight/nature-live:/var/data/reviewinsight/nature-live
      - /var/data/reviewinsight/football:/var/data/reviewinsight/football
