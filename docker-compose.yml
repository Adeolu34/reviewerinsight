services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - server/.env
    depends_on:
      - mongo
    restart: unless-stopped
    volumes:
      - video-data:/var/data/reviewinsight/videos

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
  video-data:
